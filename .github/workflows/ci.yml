name: ci

# Типы, юнит-тесты, лексикон-тест и e2e — раньше это проверялось только
# локально на машине разработчика: единственный воркфлоу в репозитории
# (perf-budget) следит за весом бандла и ни разу не запускал сборку типов
# или тестовый набор. Красный tsc или упавший юнит-тест мог неделями жить
# в ветке незамеченным.
#
# Три отдельные job вместо одной: typecheck и unit падают за секунды и не
# должны ждать e2e с поднятым dev-сервером; при провале видно сразу, какой
# слой сломан.
#
# Node 22, не 20: test:unit запускает .ts-файлы тестов через
# `node --experimental-strip-types` (см. package.json), а этот флаг появился
# в Node 22.6 — на Node 20 команда падает с «bad option» ещё до первого
# теста. Требование зафиксировано и в package.json (engines.node).

on:
  pull_request:
  workflow_dispatch:

jobs:
  typecheck:
    name: Typecheck + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Линт живёт здесь, а не отдельной job: он занимает секунды и логически
      # относится к тому же слою «статические проверки», что и tsc.
      - run: npm run lint

  unit:
    name: Unit tests + lexicon
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - run: npm run test:lexicon

  rls:
    name: RLS policies
    runs-on: ubuntu-latest
    # Единственная job, которой нужна настоящая база: RLS проверяется только
    # исполнением, а не чтением политик. Схема поднимается с нуля из миграций
    # на одноразовый контейнер — боевой проект не задействован никак.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      # На образах GitHub psql обычно есть, но версия и наличие не
      # гарантированы контрактом — ставим явно, если его нет.
      - name: Ensure psql
        run: command -v psql >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client)
      - name: Apply schema and run RLS tests
        run: npm run test:rls
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run e2e tests
        run: npm run test:e2e
        env:
          # Дамми anon-ключ: e2e проверяет anon-контур (редиректы, 401 на
          # приватных маршрутах) — реальных данных не читает и не пишет.
          NEXT_PUBLIC_SUPABASE_URL: https://uuopxzlcmzdtwebottar.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key-for-e2e
      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
